# The gate, on Linux.
#
# `node tools/verify.mjs` is the whole of it. The stage graph, the ordering, the concurrency and the
# verdict are the ones in the repository; nothing about the run is described twice, and a stage
# added to `tools/verify.mjs` is in this job the moment it lands, with no edit here.
#
# What this job does that the local gate does not is run on a different operating system. Atlas has
# only ever been verified on Windows, and the tooling carries twenty-eight `process.platform`
# branches whose other half has never executed. Anything this finds is a defect in the thing it
# names (a path joined with a backslash, a line ending assumed, a store location hard-coded)
# and belongs fixed there rather than worked around in this file.
name: verify

# Every push to `main`, every pull request, and on request. This ran on dispatch alone while the
# repository was private, because the included minutes were one pool shared by every private
# repository on the account and a run here was a run another repository did not get. A public
# repository has no such pool: standard runners are free and unmetered, so the reason to ration
# this is gone and the cost of an automatic run is wall time nobody is waiting on.
#
# Every commit is gate-green locally before it is pushed, so what this adds is Linux rather than a
# second opinion on the same stages. Atlas is developed on Windows, and the tooling carries
# `process.platform` branches whose other half only executes here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch, and a newer run supersedes one still going: a superseded run proves a commit
# nobody is looking at any more, and a queue of those delays the run somebody is waiting for.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Measured on this repository's own runs rather than estimated, and on two of them because one
    # number cannot show its own spread: 1,509 and 1,735 seconds of gate wall over 3,936 and 3,939
    # seconds of stage time, both at `peak 4 of 4 concurrent`, in jobs of 27 and 31 minutes. The
    # stage time is the work and it is steady to three seconds; the wall is what four shared cores
    # did with it that hour. Setup is 81 seconds with every cache cold, so a warm run saves almost
    # nothing and the job is the gate. The same gate is 876 seconds locally over 1,865 at a peak of
    # 18 of 32: not slower per unit of work, four cores where that machine has thirty-two, so the
    # serial part arrives whole. The limit is high because a slow green is a result and a killed
    # run is not.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # `packageManager` in package.json is the pin, and it is the only place the version is
      # written. Installed rather than activated through Corepack, which Node no longer ships in
      # every line Atlas supports.
      - name: Install pnpm
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${version}"
          pnpm --version

      - name: Locate the pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'fixtures/**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Three engines, at the version the lockfile pins. `--with-deps` installs the system
      # libraries WebKit and Firefox need, which a hosted runner does not carry.
      - name: Cache the browser engines
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      # `verify:node-compatibility` downloads nothing itself, on purpose: a verifier that fetches
      # its own subject can pass by fetching the wrong one. The staging step checks each archive
      # against nodejs.org's published SHASUMS256 before it unpacks it.
      - name: Cache the pinned Node builds
        uses: actions/cache@v6
        with:
          path: .runtimes/node
          key: node-runtimes-${{ runner.os }}-${{ hashFiles('tools/stage-node-runtimes.mjs') }}

      - run: pnpm run stage:node-runtimes

      # The consumer stages install `--offline --frozen-lockfile`, so every package their
      # committed lockfiles name has to be in the store before the gate starts. The workspace
      # install does not put it there: the two resolve different versions of the same
      # transitives, and this is what found that out.
      - run: pnpm run stage:consumer-store

      - name: Gate
        run: node tools/verify.mjs

      # The per-stage logs and traces the run wrote. They are what a red verdict is diagnosed from,
      # and on a hosted runner there is nothing else left to look at.
      - name: Keep the run's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-run-${{ github.run_id }}
          path: tmp/verify-run
          if-no-files-found: warn
          retention-days: 14
