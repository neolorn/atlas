  notification.saved: Changes saved.
  incremental.ready: Incremental localization boundary ready.
  incremental.action: Activate incremental boundary
  extension.uppercase: 'Custom function: {$name :feature:uppercase emphasis=loud}'
  extension.badge:
    message: '{#badge tone=info}New{/badge}'
    slots:
      badge: feature:badge
  feature-state.ready: Feature state ready
  feature-state.pending: Feature state pending
  asset.alt: Atlas handbook cover
  control.retry: Retry
  control.submit: Submit
  counter.label: count
  dynamic.hide: Hide
  dynamic.retain: Retain
  dynamic.retry: Retry region
  dynamic.skeleton: Skeleton
  dynamic.substitute: Substitute
  form.percent-label: Percentage
  locale.progressive: Progressive Arabic
  scope.load: Load lazy scope
  scope.not-loaded: Not loaded
  plural.items: |-
    .input {$count :number}
    .match $count
    one {{{$count :number} item}}
    * {{{$count :number} items}}
  plural.nested: |-
    .input {$count :number}
    .input {$kind :string}
    .match $kind $count
    box one {{{$count :number} box}}
    box * {{{$count :number} boxes}}
    * one {{{$count :number} unit}}
    * * {{{$count :number} units}}
  hostile.authored-isolate: "Ref \u2066ABC\u2069 ok"
  hostile.authored-mark: "Total \u200F42 due"
  hostile.authored-invisible: "SKU\u200BA\u2060B"
  hostile.interpolated: 'Order {$reference} shipped'
  hostile.rich: 'Order {#strong}{$reference}{/strong} shipped'
  fmt.number: 'Count {$v :number}'
  fmt.integer: 'Items {$v :integer}'
  fmt.percent: 'Share {$v :percent}'
  fmt.currency: 'Price {$v :currency currency=EGP}'
  fmt.unit: 'Size {$v :unit unit=meter}'
  fmt.date: 'On {$v :date}'
  fmt.time: 'At {$v :time}'
  fmt.datetime: 'When {$v :datetime}'
families:
  feature-state:
    template: 'feature-state.{state}'
    segments:
      state: feature:state
