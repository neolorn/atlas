    .input {$count :number}
    .input {$kind :string}
    .match $kind $count
    box zero {{لا صناديق}}
    box one {{صندوق واحد}}
    box two {{صندوقان}}
    box few {{{$count :number} صناديق}}
    box many {{{$count :number} صندوقًا}}
    box * {{{$count :number} صندوق}}
